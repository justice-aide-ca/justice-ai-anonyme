        const LANGS = ['fr','en','es','zh','hi','ar'];
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function render(lang) {
            const t = translations[lang] || translations.fr;
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.title = t.pageTitle + ' – Justice AI';
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('updated').textContent = t.updated;
            document.getElementById('backLink').textContent = t.back;
            document.getElementById('fPrivacy').textContent = t.fPrivacy;
            document.getElementById('fTerms').textContent = t.fTerms;
            document.getElementById('fContact').textContent = t.fContact;
            let html = '';
            t.sections.forEach(function(sec) {
                if (sec.h) html += '<h2>' + esc(sec.h) + '</h2>';
                if (sec.p) html += '<p>' + esc(sec.p) + '</p>';
                if (sec.list) html += '<ul>' + sec.list.map(function(li){ return '<li>' + esc(li) + '</li>'; }).join('') + '</ul>';
            });
            if (t.note) html += '<div class="note">' + esc(t.note) + '</div>';
            if (t.contactLink) html += '<p style="margin-top:1rem;"><a href="' + t.contactLink.url + '" target="_blank" style="color:#3498db;font-weight:600;">' + esc(t.contactLink.label) + '</a></p>';
            document.getElementById('content').innerHTML = html;
        }
        let lang = 'fr';
        try { lang = localStorage.getItem('justice_lang') || ''; } catch(e) {}
        if (!LANGS.includes(lang)) {
            const nav = (navigator.language || '').slice(0,2).toLowerCase();
            lang = LANGS.includes(nav) ? nav : 'fr';
        }
        const sel = document.getElementById('langSelect');
        sel.value = lang;
        sel.addEventListener('change', function() {
            try { localStorage.setItem('justice_lang', sel.value); } catch(e) {}
            render(sel.value);
        });
        render(lang);
    </script>

</html>
