<script src="https://js.stripe.com/v3/"></script>
<script>
    // Générer ou récupérer l'ID utilisateur
    let userId = localStorage.getItem('justice_ai_user_id');
    if (!userId) {
        userId = 'USER_' + Math.random().toString(36).substr(2, 16) + '_' + Date.now();
        localStorage.setItem('justice_ai_user_id', userId);
    }
    
    // Initialiser Stripe avec la clé publique
    const stripe = Stripe('pk_live_51TgtyELg3bnLPIVPUNyZEMW7iH4nsC4NDmXsemxRnoFC2CaanLyGwHw5mcmxokLbQLjYhqA9Vr69efexi5721qd0093apuzMs');
    
    // Gestion de l'abonnement
    const subscribeButton = document.getElementById('subscribeButton');
    if (subscribeButton) {
        subscribeButton.addEventListener('click', async () => {
            subscribeButton.disabled = true;
            subscribeButton.textContent = '⏳ Redirection Stripe...';
            
            try {
                const response = await fetch('/api/create-subscription', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        successUrl: window.location.origin + '/success.html',
                        cancelUrl: window.location.origin + '/cancel.html'
                    })
                });
                
                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert('Erreur: ' + (data.error || 'Impossible de créer la session'));
                    subscribeButton.disabled = false;
                    subscribeButton.textContent = '💳 S\'abonner $29.99/an';
                }
            } catch (error) {
                alert('Erreur de connexion: ' + error.message);
                subscribeButton.disabled = false;
                subscribeButton.textContent = '💳 S\'abonner $29.99/an';
            }
        });
    }
</script>
