<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justice AI - Assistance Juridique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 600;
            font-size: 14px;
            padding: 6px 18px;
            border-radius: 30px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .info-box {
            background: #f0f4ff;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .info-box .icon {
            font-size: 24px;
        }

        .info-box strong {
            display: block;
            color: #1a1a2e;
        }

        .info-box p {
            color: #333;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #1a1a2e;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: white;
            transition: border 0.2s;
        }

        select:focus,
        textarea:focus {
            border-color: #667eea;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .result {
            margin-top: 24px;
            padding: 18px;
            border-radius: 16px;
            display: none;
            line-height: 1.6;
        }

        .result.success {
            display: block;
            background: #e6f7e6;
            color: #1e5a1e;
            border: 1px solid #b8e0b8;
        }

        .result.error {
            display: block;
            background: #ffe6e6;
            color: #8b1e1e;
            border: 1px solid #f5c6c6;
        }

        .ai-response {
            background: white;
            padding: 18px;
            border-radius: 14px;
            margin-top: 16px;
            border-left: 5px solid #667eea;
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 15px;
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .footer i {
            margin: 0 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">

            <div class="badge">🔒 100% ANONYME</div>
            <h1>⚖️ Assistance Juridique</h1>
            <div class="subtitle">Justice accessible à tous, en toute confidentialité</div>

            <div class="info-box">
                <div class="icon">🕵️</div>
                <div>
                    <strong>Confidentialité totale</strong>
                    <p>Aucune information personnelle n'est demandée ni stockée. Votre identité reste anonyme.</p>
                </div>
            </div>

            <form id="anonForm">
                <div class="form-group">
                    <label>🌍 Pays</label>
                    <select id="country" required>
                        <option value="">Sélectionnez votre pays</option>
                        <option value="fr">France</option>
                        <option value="ca">Canada</option>
                        <option value="us">États-Unis</option>
                        <option value="ma">Maroc</option>
                        <option value="dz">Algérie</option>
                        <option value="tn">Tunisie</option>
                        <option value="sn">Sénégal</option>
                        <option value="ci">Côte d'Ivoire</option>
                        <option value="cm">Cameroun</option>
                        <option value="be">Belgique</option>
                        <option value="ch">Suisse</option>
                        <option value="de">Allemagne</option>
                        <option value="es">Espagne</option>
                        <option value="it">Italie</option>
                        <option value="pt">Portugal</option>
                        <option value="gb">Royaume-Uni</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>⚖️ Type de situation</label>
                    <select id="caseType" required>
                        <option value="">Sélectionnez</option>
                        <option value="civil">Litige civil</option>
                        <option value="criminal">Droit pénal</option>
                        <option value="family">Droit de la famille</option>
                        <option value="labor">Droit du travail</option>
                        <option value="housing">Logement / Immobilier</option>
                        <option value="consumer">Consommation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📝 Décrivez votre situation</label>
                    <textarea id="description" placeholder="Décrivez clairement votre situation juridique..." required></textarea>
                </div>

                <button type="submit" id="submitBtn">📤 Envoyer ma demande anonyme</button>
            </form>

            <div id="result"></div>

            <div class="footer">
                🔒 100% anonyme · Sans inscription · Aucune donnée personnelle
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById('anonForm');
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');

        async function loadCountries() {
            try {
                const res = await fetch('/api/countries');
                const countries = await res.json();
                const select = document.getElementById('country');
                select.innerHTML = '<option value="">Sélectionnez votre pays</option>';
                countries.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.code;
                    option.textContent = c.name;
                    select.appendChild(option);
                });
            } catch (e) {
                console.log('Erreur chargement pays:', e);
            }
        }

        loadCountries();

        form.onsubmit = async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Envoi en cours...';
            resultDiv.style.display = 'block';
            resultDiv.className = 'success';
            resultDiv.innerHTML = '⏳ Génération du conseil...';

            const data = {
                country: document.getElementById('country').value,
                caseType: document.getElementById('caseType').value,
                description: document.getElementById('description').value
            };

            try {
                const res = await fetch('/api/submit-anonymous-case', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                let aiHtml = '';
                if (result.aiResponse) {
                    aiHtml = `<div class="ai-response"><strong>🤖 Votre conseil personnalisé :</strong><br><br>${result.aiResponse.replace(/\n/g, '<br>')}</div>`;
                }

                resultDiv.innerHTML = `
                    <strong>✅ Votre demande a bien été reçue</strong><br>
                    📌 Référence : <strong>${result.reference}</strong><br>
                    📅 Date : ${new Date(result.date).toLocaleString()}
                    ${aiHtml}
                `;

                form.reset();

            } catch (err) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `❌ Une erreur est survenue :<br>${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 Envoyer ma demande anonyme';
            }
        };
    </script>

</body>
</html>
